site_name: PyAERMOD
site_description: Python wrapper for EPA's AERMOD atmospheric dispersion model
site_url: https://atmmod.github.io/pyaermod/
repo_url: https://github.com/atmmod/pyaermod
repo_name: atmmod/pyaermod

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - GUI User Guide: gui-guide.md
  - Guides:
      - AERMET Tuning: aermet-tuning-guide.md
      - AERMAP Troubleshooting: aermap-troubleshooting.md
      - Common Errors: common-errors.md
      - Regulatory Matrix: regulatory-matrix.md
  - Validation: validation.md
  - Design-Value Validation: design-value-validation.md
  - Desktop App: desktop.md
  - Architecture: architecture.md
  - Teaching:
      - Student Guide: teaching/student-guide.md
      - Refinery Assignments: teaching/refinery-assignments.md
      - README: teaching/README.md
  - API Reference:
      - Overview: api/index.md
      - Project building:
          - input_generator (facade): api/input_generator.md
          - sources: api/sources.md
          - receptors: api/receptors.md
          - pathways: api/pathways.md
          - input_reader: api/input_reader.md
          - source_importers: api/source_importers.md
      - Validation:
          - validator: api/validator.md
          - validator_advanced: api/validator_advanced.md
          - regulatory: api/regulatory.md
      - Execution:
          - runner: api/runner.md
          - runner_utils: api/runner_utils.md
          - cli: api/cli.md
      - Outputs:
          - output_parser: api/output_parser.md
          - aermod_outputs: api/aermod_outputs.md
          - postfile: api/postfile.md
          - design_values: api/design_values.md
          - naaqs: api/naaqs.md
      - Visualization:
          - visualization: api/visualization.md
          - advanced_viz: api/advanced_viz.md
          - kmz_export: api/kmz_export.md
      - Meteorology:
          - aermet: api/aermet.md
          - aermet_runner: api/aermet_runner.md
          - aersurface: api/aersurface.md
          - aersurface_runner: api/aersurface_runner.md
          - met_ingest: api/met_ingest.md
          - met_qaqc: api/met_qaqc.md
      - Screening:
          - aerscreen: api/aerscreen.md
          - aerscreen_runner: api/aerscreen_runner.md
      - Terrain:
          - aermap: api/aermap.md
          - terrain: api/terrain.md
          - terrain_utils: api/terrain_utils.md
          - geospatial: api/geospatial.md
      - Downwash:
          - bpip: api/bpip.md
          - prime: api/prime.md
      - Chemistry:
          - chemistry_presets: api/chemistry_presets.md
      - Validation:
          - regulatory_parity: api/regulatory_parity.md
          - epa_sources: api/epa_sources.md
      - GUI:
          - gui_v2 (NiceGUI): api/gui_v2.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            heading_level: 2
            show_signature_annotations: true
            separate_signature: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
