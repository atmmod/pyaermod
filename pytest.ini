[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    -m "not slow and not e2e"
    --cov=pyaermod
    --cov-config=.coveragerc
    --cov-report=term-missing:skip-covered
# A test still running after this many seconds has every thread's stack
# written to stderr (pytest's faulthandler plugin); the test is not stopped.
# It names the test when a run hangs: one did in tests/test_ensemble.py on
# CI (2026-11-20) and the job was cancelled with nothing to say which.
faulthandler_timeout = 300
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    epa: marks tests requiring EPA v24142 test case directory
    e2e: GUI journeys in a real browser (tests/e2e; run with make test-gui-e2e)
