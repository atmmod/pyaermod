[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaermod"
version = "2.0.0"
description = "Python wrapper for EPA's AERMOD air dispersion model"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Shannon Capps", email = "shannon.capps@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = ["aermod", "air quality", "dispersion", "modeling", "atmospheric"]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/atmmod/pyaermod"
Documentation = "https://atmmod.github.io/pyaermod/"
Repository = "https://github.com/atmmod/pyaermod"
Issues = "https://github.com/atmmod/pyaermod/issues"
Changelog = "https://github.com/atmmod/pyaermod/blob/main/CHANGELOG.md"

# Lower bounds are validated in CI: the `min-deps` job installs the oldest
# versions pinned in min-constraints.txt and runs the suite. Keep the two
# files in sync when raising a floor.
[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "folium>=0.14.0",
]
geo = [
    "pyproj>=3.4.0",
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "scipy>=1.10.0",
]
terrain = [
    "requests>=2.32.2",
]
met = [
    "requests>=2.32.2",
]
hpc = [
    "tqdm>=4.60.0",
    "requests>=2.32.2",
]
cad = [
    "ezdxf>=1.0.0",
]
gui = [
    "nicegui>=3.0",
]
gui-desktop = [
    "nicegui>=3.0",
    "pywebview>=5.0",
]
all = [
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "folium>=0.14.0",
    "pyproj>=3.4.0",
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "requests>=2.32.2",
    "tqdm>=4.60.0",
    "ezdxf>=1.0.0",
    "nicegui>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",  # NiceGUI headless User harness (tests/test_gui_v2_smoke.py)
    "ruff>=0.4.0",
    "hypothesis>=6.82.0",
    "build",
    "twine",
]

[project.scripts]
pyaermod = "pyaermod.cli:main"
pyaermod-app = "pyaermod.gui_v2:main"
pyaermod-desktop = "pyaermod.gui_v2.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyaermod = ["py.typed"]

[tool.mypy]
# Advisory configuration as of v1.5; ratchet toward strict mode over
# time. The baseline error count is published in CI logs.
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Per-module overrides: advanced_viz.py has legitimate **kwargs dispatch
# into source dataclasses; that's a runtime check not a static one.
[[tool.mypy.overrides]]
module = ["pyaermod.advanced_viz"]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (let formatter handle)
    "E741",   # ambiguous variable name (l, O, I) — used in AERMOD context
    "B008",   # function call in default argument (dataclass field())
    "B905",   # zip() without strict= (not always needed)
    "RUF012", # mutable class variables (dataclass pattern)
    "SIM108", # use ternary operator (readability preference)
    "UP006",  # use builtin type instead of typing (List -> list) — keep existing style
    "UP007",  # use X | Y instead of Union[X, Y] — keep existing style
    "UP035",  # deprecated import from typing — keep existing style
    "UP045",  # use X | None instead of Optional[X] — keep existing style
    "RUF001", # ambiguous unicode character in string (degree symbols etc.)
    "RUF002", # ambiguous unicode character in docstring
    "RUF003", # ambiguous unicode character in comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "F841", "F401"]
"src/pyaermod/__init__.py" = ["F401", "RUF022"]
"src/pyaermod/api.py" = ["F401", "RUF022"]
"benchmarks/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["pyaermod"]
