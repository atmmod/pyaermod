name: Real AERMOD smoke

# Exercises pyaermod against a real AERMOD binary using the EPA-vendored
# AERTEST case. Pulls a Linux AERMOD 24142 static build from EPA's SCRAM
# site and runs the end-to-end test. Treated as a separate workflow so
# the main `tests.yml` run stays fast.
#
# Runs weekly + on demand; also triggered on changes to the runner or
# input-generation modules so we catch regressions quickly.

on:
  schedule:
    - cron: "0 7 * * 1"  # Monday 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "src/pyaermod/runner.py"
      - "src/pyaermod/runner_utils.py"
      - "src/pyaermod/input_generator.py"
      - "src/pyaermod/input_reader.py"
      - "tests/test_real_aermod.py"
      - ".github/workflows/real_aermod.yml"

jobs:
  aertest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyaermod
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download AERMOD 24142 Linux binary
        run: |
          set -euxo pipefail
          mkdir -p /tmp/aermod
          cd /tmp/aermod
          # EPA provides a statically linked Linux build under SCRAM.
          # Pin to version 24142 (matches our vendored test case).
          curl -sSL -o aermod.zip \
            "https://gaftp.epa.gov/Air/aqmg/SCRAM/models/preferred/aermod/aermod_24142.zip"
          unzip -q aermod.zip
          # Find the Linux executable in the unpacked tree and put it on PATH
          LINUX_EXE=$(find . -type f -name 'aermod' -o -name 'aermod.exe' | grep -iv win | head -1)
          if [ -z "$LINUX_EXE" ]; then
              echo "Could not locate Linux AERMOD executable in EPA archive"
              exit 1
          fi
          chmod +x "$LINUX_EXE"
          sudo cp "$LINUX_EXE" /usr/local/bin/aermod
          aermod --help || true

      - name: Run real-AERMOD smoke test
        run: pytest tests/test_real_aermod.py -v
