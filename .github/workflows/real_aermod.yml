name: Real AERMOD smoke

# Exercises pyaermod against a real AERMOD binary using the EPA-vendored
# AERTEST case. Compiles AERMOD from the Fortran source in aermod/
# and runs the end-to-end test.

on:
  schedule:
    - cron: "0 7 * * 1"  # Monday 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "src/pyaermod/runner.py"
      - "src/pyaermod/runner_utils.py"
      - "src/pyaermod/input_generator.py"
      - "src/pyaermod/input_reader.py"
      - "tests/test_real_aermod.py"
      - ".github/workflows/real_aermod.yml"
      - "aermod/*.f"

jobs:
  aertest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyaermod
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download + compile AERMOD from EPA source
        run: |
          set -euxo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq gfortran
          mkdir -p /tmp/aermod_build && cd /tmp/aermod_build
          curl -sSL -o aermod_source.zip \
            "https://gaftp.epa.gov/Air/aqmg/SCRAM/models/preferred/aermod/aermod_source.zip"
          unzip -q aermod_source.zip
          cd aermod_source_code_*
          # modules.f must be compiled first (produces .mod files)
          gfortran -c -O2 modules.f
          gfortran -c -O2 grsm.f
          gfortran -c -O2 aermod.f setup.f coset.f soset.f reset.f meset.f \
            ouset.f inpsum.f metext.f iblval.f siggrid.f tempgrid.f \
            windgrid.f calc1.f calc2.f prise.f arise.f prime.f sigmas.f \
            pitarea.f uninam.f output.f evset.f evcalc.f evoutput.f \
            rline.f bline.f
          gfortran -O2 -o aermod *.o
          chmod +x aermod
          sudo cp aermod /usr/local/bin/aermod
          aermod --help || true

      - name: Run real-AERMOD smoke test
        run: pytest tests/test_real_aermod.py -v
