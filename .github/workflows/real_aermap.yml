name: Real AERMAP smoke

# Exercises pyaermod against a real AERMAP binary. Compiles AERMAP
# from the Fortran source in aermap/aermap_source_code_24142/ and
# runs tests/test_real_aermap.py.

on:
  schedule:
    - cron: "30 7 * * 1"  # Monday 07:30 UTC (staggered from real_aermod)
  workflow_dispatch:
    inputs:
      source_url:
        description: "EPA SCRAM AERMAP source archive URL (override to try a new EPA release)"
        required: false
        default: "https://gaftp.epa.gov/Air/aqmg/SCRAM/models/related/aermap/aermap_source.zip"
  pull_request:
    paths:
      - "src/pyaermod/terrain.py"
      - "src/pyaermod/terrain_utils.py"
      - "src/pyaermod/aermap.py"
      - "tests/test_real_aermap.py"
      - ".github/workflows/real_aermap.yml"
      - "aermap/**/*.f"

env:
  # `inputs.source_url` is only set for workflow_dispatch; every other
  # trigger falls through to the pinned default.
  AERMAP_SOURCE_URL: ${{ inputs.source_url || 'https://gaftp.epa.gov/Air/aqmg/SCRAM/models/related/aermap/aermap_source.zip' }}

jobs:
  aermap_smoke:
    runs-on: ubuntu-latest
    # Downloads EPA source over gaftp (flaky, retried) and compiles it; cap
    # the job so a stalled fetch cannot sit on a runner for the 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyaermod
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compute EPA source cache key
        id: src
        # Keyed on the URL (so an override never reuses the default's archive)
        # plus the calendar month, so a same-URL EPA re-release is picked up
        # within a month while gaftp flakiness inside the month is absorbed.
        run: |
          echo "key=epa-aermap-source-$(printf '%s' "$AERMAP_SOURCE_URL" | sha256sum | cut -c1-16)-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache EPA source archive
        uses: actions/cache@v4
        with:
          path: /tmp/aermap_build/aermap_source.zip
          key: ${{ steps.src.outputs.key }}

      - name: Download + compile AERMAP from EPA source
        run: |
          set -euxo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq gfortran
          mkdir -p /tmp/aermap_build && cd /tmp/aermap_build
          # fetch_epa_source.sh reuses a cache-restored archive, prints the
          # archive's top-level dir (EPA's version) and adds it to the job summary.
          bash "$GITHUB_WORKSPACE/scripts/fetch_epa_source.sh" \
            "$AERMAP_SOURCE_URL" \
            aermap_source.zip
          unzip -q aermap_source.zip
          # Derive the extracted source dir from the archive so a future EPA
          # version rename (as happened to AERMOD) doesn't break the build.
          topdir=$(unzip -Z1 aermap_source.zip | awk -F/ 'NF>1{print $1; exit}')
          [ -n "$topdir" ] && cd "$topdir"
          # Guard against read-only extraction (as seen with EPA's AERMOD v26135).
          chmod -R u+w .
          # Modules must be compiled first (produce .mod files)
          gfortran -c -O2 mod_main1.f mod_tifftags.f
          gfortran -c -O2 aermap.f sub_calchc.f sub_chkadj.f sub_chkext.f \
            sub_demchk.f sub_nedchk.f sub_cnrcnv.f sub_demrec.f sub_demsrc.f \
            sub_domcnv.f sub_initer_dem.f sub_initer_ned.f sub_nadcon.f \
            sub_reccnv.f sub_recelv.f sub_srccnv.f sub_srcelv.f sub_utmgeo.f \
            sub_read_tifftags.f
          gfortran -O2 -o aermap *.o
          chmod +x aermap
          sudo cp aermap /usr/local/bin/aermap
          aermap --help || true

      - name: Run real-AERMAP smoke test
        run: pytest tests/test_real_aermap.py -v
