name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type-check with mypy (ratchet gate)
        # Not yet clean, but no longer advisory: scripts/mypy_gate.py fails
        # the job only if the error count exceeds the integer committed in
        # mypy-baseline.txt. When you fix errors, lower the baseline with
        #   python scripts/mypy_gate.py --update
        # The pin below must move together with the baseline (different
        # mypy releases report different counts). The count also depends on
        # which optional extras are importable — typed packages (nicegui,
        # ezdxf, ...) surface errors that ignore_missing_imports hides — so
        # measure the baseline in an environment with `.[dev,all]` installed.
        if: matrix.python-version == '3.12'
        run: |
          pip install --quiet "mypy==2.3.1"
          python scripts/mypy_gate.py

      - name: Run tests with coverage
        # --cov-fail-under gates the build at 95% coverage on the
        # measured-modules surface. Drift below floor fails CI rather
        # than silently regressing.
        run: |
          pytest --tb=short -q \
            --cov=pyaermod \
            --cov-config=.coveragerc \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=95

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  min-deps:
    # Validates the lower bounds declared in pyproject.toml: installs the
    # oldest versions pinned in min-constraints.txt and runs the suite
    # against them. Bump a pin there and the matching floor together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin

      - name: Install oldest supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]" -c min-constraints.txt
          echo "::group::Resolved versions"
          pip list --format=columns | grep -iE "^(numpy|pandas|scipy|matplotlib|folium|pyproj|shapely|geopandas|rasterio|requests|tqdm|ezdxf|nicegui) " || true
          echo "::endgroup::"

      - name: Run core test suite against minimum versions
        # Coverage is gated on the main matrix; here only pass/fail matters.
        run: pytest --tb=short -q -p no:cacheprovider --no-cov
