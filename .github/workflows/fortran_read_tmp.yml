name: fortran-read (temporary)
on:
  push:
    branches: [claude/fortran-read]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: "https://gaftp.epa.gov/Air/aqmg/SCRAM/models/preferred/aermod/aermod_source.zip"
    steps:
      - uses: actions/checkout@v4
      - name: Read the Fortran
        run: |
          bash scripts/fetch_epa_source.sh "$URL" /tmp/src.zip
          mkdir /tmp/src && unzip -q /tmp/src.zip -d /tmp/src
          cd "$(dirname "$(find /tmp/src -iname 'aermod.f' | head -1)")"
          ls
          n() { awk -v a="$2" -v b="$3" 'FNR>=a && FNR<=b {print FILENAME":"FNR": "$0}' "$1"; }
          echo "=====POSTFL"; n calc2.f 2916 3012
          echo "=====header"; n ouset.f 1676 1730
          echo "=====PERAVE"; n output.f 1 63
          echo "=====SUMVAL"; n calc2.f 2114 2251
          echo "=====BGVAL"; n calc2.f 150 210
          echo "=====yearend metext"; n metext.f 700 740
          echo "=====yearend meset"; n meset.f 1105 1140
          echo "=====CHK_ENDYR"; grep -n -i -A70 "^ *SUBROUTINE CHK_ENDYR" aermod.f | grep -v "^[0-9]*-[Cc]\*\*\*" | head -n 110
          echo "=====surface read"; grep -n -i -B3 -A12 "READ *( *MFUNIT\|READ( MFUNIT" metext.f | head -n 90
          echo "=====messages"; grep -n -i "'440'\|'460'\|ECD.*\(Calm\|Missing\) Hour\|Number of .* Hours" modules.f output.f | head -n 20
