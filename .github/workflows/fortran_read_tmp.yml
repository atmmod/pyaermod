name: fortran-read (temporary)
on:
  push:
    branches: [claude/fortran-read]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URL: "https://gaftp.epa.gov/Air/aqmg/SCRAM/models/preferred/aermod/aermod_source.zip"
    steps:
      - uses: actions/checkout@v4
      - name: Read the Fortran
        run: |
          bash scripts/fetch_epa_source.sh "$URL" /tmp/src.zip
          mkdir /tmp/src && unzip -q /tmp/src.zip -d /tmp/src
          cd "$(dirname "$(find /tmp/src -iname 'aermod.f' | head -1)")"
          ls
          n() { awk -v a="$2" -v b="$3" 'FNR>=a && FNR<=b {print FILENAME":"FNR": "$0}' "$1"; }
          echo "=====subroutines"; grep -n -i "^ *SUBROUTINE" output.f calc2.f | cut -c1-70
          echo "=====postfile unit"; grep -n -i "IPSUNT\|PSTFRM\|IPSFRM" *.f | head -n 80
          echo "=====postfile writes"; grep -n -i -B45 -A14 "WRITE *(IPSUNT" output.f | head -n 420
          echo "=====HRLOOP"; n aermod.f 1160 1480
          echo "=====metext kurdat"; n metext.f 1380 1432
          echo "=====clm/msg set"; grep -n -i -B4 -A10 "CLMHR *=\|MSGHR *=" metext.f | head -n 220
          echo "=====AVER"; grep -n -i -A75 "^ *SUBROUTINE AVER" calc2.f | head -n 110
          echo "=====ppb"; grep -n -i "O3_PPB\|NO2_PPB\|SO2_PPB\|CO_PPB\|O3_PPM" modules.f | head -n 20
          echo "=====hour convention"; grep -n -i "hour.\{0,12\}end\|LST\|standard time\|time zone" metext.f meset.f | head -n 40
