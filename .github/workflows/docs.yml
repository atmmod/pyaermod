name: Build and deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/pyaermod/**/*.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/pyaermod/**/*.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Grant the workflow token the rights Pages + deploy-pages need
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel in-flight deploys; queue up one run at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mkdocs-material uses git for revision dates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps for optional imports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgdal-dev gdal-bin

      - name: Install pyaermod + docs deps
        run: |
          python -m pip install --upgrade pip
          # docstrings reference all the optional deps; install [all] so
          # mkdocstrings can resolve them without ImportError
          pip install -e ".[all]"
          pip install -r docs/requirements.txt

      - name: Build docs with strict mode
        run: mkdocs build --strict --site-dir _site

      - name: Upload artifact for Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
