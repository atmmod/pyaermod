repos:
  # Same ruff release as the [dev] extra and CI's `ruff check`; an older
  # hook cannot parse the UP045 selector in pyproject.toml and fails every
  # commit. The formatter is not run: the code base is not ruff-formatted
  # and CI does not check formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # EPA's reference decks and files, and the writer's golden output,
      # are compared byte for byte, and patches against EPA's Fortran
      # carry its trailing blanks in their context lines: the blanks are
      # part of the fixture, and stripping them breaks the patch.
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/|scripts/patches/)
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
